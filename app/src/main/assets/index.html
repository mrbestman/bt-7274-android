<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VALEN AI - Permanent Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090d16;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      overflow: hidden;
    }
    .header { text-align: center; margin-top: 5px; }
    .header h1 { font-size: 20px; font-weight: 700; color: #ec4899; }
    .header p { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .status-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .avatar-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 130px;
      height: 130px;
    }
    .orb {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #ec4899 0%, #8b5cf6 50%, #3b82f6 100%);
      box-shadow: 0 0 50px rgba(236, 72, 153, 0.4);
      transition: all 0.3s ease;
    }
    .orb.listening {
      animation: pulse 1s infinite ease-in-out;
      box-shadow: 0 0 80px rgba(236, 72, 153, 0.9);
      background: radial-gradient(circle, #ef4444 0%, #ec4899 100%);
    }
    .orb.speaking {
      animation: wave 0.8s infinite ease-in-out;
      box-shadow: 0 0 100px rgba(59, 130, 246, 0.9);
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes wave { 0% { transform: scale(1.05); } 50% { transform: scale(0.95); } 100% { transform: scale(1.05); } }
    
    .chat-box {
      width: 100%;
      max-width: 400px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 10px;
      height: 110px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.4;
    }
    .user-text { color: #60a5fa; margin-bottom: 4px; font-weight: 500; }
    .valen-text { color: #f472b6; margin-bottom: 4px; font-weight: 500; }

    .debug-console {
      width: 100%;
      max-width: 400px;
      background: #000000;
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 8px;
      height: 80px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
      color: #10b981;
    }
    
    .mic-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 5px;
    }
    .mic-btn.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }
    
    .voice-select-container {
      width: 100%;
      max-width: 400px;
      margin-bottom: 10px;
      text-align: left;
    }
    .voice-select-container label {
      color: #10b981;
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
      margin-left: 4px;
    }
    .voice-select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #10b981;
      background: #000;
      color: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>BT-7274 VANGUARD AI</h1>
    <p>Protocol 3: Protect the Pilot</p>
    <div class="status-badge" id="statusBadge">● READY</div>
  </div>

  <div class="avatar-container">
    <div class="orb" id="orb"></div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="valen-text">BT-7274: Comms Link Established, Pilot. Tap below to listen.</div>
  </div>

  <div class="debug-console" id="debugConsole">
    <div>[System]: Permanent URL initialized.</div>
  </div>

  <div class="voice-select-container">
    <label for="voiceSelect">TITAN VOICE:</label>
    <select id="voiceSelect" class="voice-select" onchange="saveVoicePreference()">
      <optgroup label="Local Offline Cloning">
        <option value="BT-7274 (Local Clone)">BT-7274 (F5-TTS)</option>
      </optgroup>
      <optgroup label="ElevenLabs (Premium)">
        <option value="Bella (Female)">Bella (Female) - Recommended</option>
        <option value="Rachel (Female)">Rachel (Female)</option>
        <option value="Antoni (Male)">Antoni (Male)</option>
        <option value="Josh (Male)">Josh (Male)</option>
      </optgroup>
      <optgroup label="Edge TTS (Free)">
        <option value="Emma (Female, Edge)">Emma (Female)</option>
        <option value="Guy (Male, Edge)">Guy (Male)</option>
        <option value="Aria (Female, Edge)">Aria (Female)</option>
        <option value="Christopher (Male, Edge)">Christopher (Male)</option>
      </optgroup>
    </select>
  </div>

  <div class="voice-select-container">
    <label for="micSelect">MICROPHONE:</label>
    <select id="micSelect" class="voice-select">
      <option value="">Default Microphone</option>
    </select>
  </div>

  <button class="mic-btn" id="micBtn" onclick="toggleSmartVADListener()">▶ START 24/7 VOICE LISTENER</button>

<script>
    let globalAudioStream = null;
    let isListenerActive = false;
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isSpeaking = false;
    let silenceTimer = null;
    let isProcessing = false;
    let lastLogTime = 0;

    // --- Android Bridge Detection ---
    const isAndroid = typeof AndroidBridge !== 'undefined';

    // --- Auto-Discovery System ---
    let SERVER_URL = "";
    const DISCOVERY_TIMEOUT_MS = 2500;
    const CACHED_IP_KEY = "valen_server_ip";

    const orb = document.getElementById("orb");
    const statusBadge = document.getElementById("statusBadge");
    const chatBox = document.getElementById("chatBox");
    const micBtn = document.getElementById("micBtn");
    const debugConsole = document.getElementById("debugConsole");

    function logDebug(msg) {
      const div = document.createElement("div");
      div.innerText = "[" + new Date().toLocaleTimeString() + "] " + msg;
      debugConsole.appendChild(div);
      debugConsole.scrollTop = debugConsole.scrollHeight;
    }

    /** Try to reach the /ping endpoint at a given base URL. Returns true on success. */
    async function probeServer(baseUrl) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), DISCOVERY_TIMEOUT_MS);
        const res = await fetch(baseUrl + "/ping", { signal: controller.signal });
        clearTimeout(timer);
        if (res.ok) {
          const data = await res.json();
          return data.status === "online";
        }
      } catch (_) {}
      return false;
    }

    /** Multi-strategy server discovery. */
    async function discoverServer() {
      logDebug("Starting server auto-discovery...");
      statusBadge.innerText = "● SEARCHING FOR VALEN SERVER...";

      // Strategy 0: Try Android bridge cached URL first
      if (isAndroid && AndroidBridge.getServerUrl()) {
        const cachedUrl = AndroidBridge.getServerUrl();
        logDebug("Try 0: Android bridge cached URL " + cachedUrl);
        if (await probeServer(cachedUrl)) {
          logDebug("SUCCESS via Android bridge cache!");
          return cachedUrl;
        }
      }

      // Strategy 1: If loaded directly from the server (not file://), use origin
      if (window.location.protocol.startsWith("http") && window.location.hostname !== "localhost") {
        const originUrl = window.location.origin;
        logDebug("Try 1: page origin " + originUrl);
        if (await probeServer(originUrl)) {
          logDebug("SUCCESS via page origin!");
          return originUrl;
        }
      }

      // Strategy 2: Cached IP from a previous successful connection
      const cachedIp = localStorage.getItem(CACHED_IP_KEY);
      if (cachedIp) {
        const cachedUrl = "https://" + cachedIp + ":5000";
        logDebug("Try 2: cached IP " + cachedIp);
        if (await probeServer(cachedUrl)) {
          logDebug("SUCCESS via cached IP!");
          return cachedUrl;
        }
      }

      // Strategy 3: mDNS name (works on some Android devices / Chrome)
      const mdnsUrl = "https://valen.local:5000";
      logDebug("Try 3: mDNS (valen.local)");
      if (await probeServer(mdnsUrl)) {
        logDebug("SUCCESS via mDNS!");
        return mdnsUrl;
      }

      // Strategy 4: Try known/common IPs directly (fast, parallel)
      logDebug("Try 4: probing known IPs...");
      const knownIps = [
        "10.0.0.252", "192.168.1.1", "192.168.0.1",
        "10.0.0.1", "192.168.1.100", "192.168.0.100",
        "100.90.240.21", "100.104.7.92"
      ];
      const knownResults = await Promise.allSettled(
        knownIps.map(async (ip) => {
          const url = "https://" + ip + ":5000";
          if (await probeServer(url)) return url;
          throw new Error("no");
        })
      );
      for (const r of knownResults) {
        if (r.status === "fulfilled") {
          logDebug("SUCCESS via known IP: " + r.value);
          return r.value;
        }
      }

      // Strategy 5: Quick scan of 10.0.0.x and 192.168.1.x (most common home subnets)
      logDebug("Try 5: scanning local subnets...");
      const candidates = [];
      for (let d = 2; d <= 254; d++) {
        candidates.push("10.0.0." + d);
        candidates.push("192.168.1." + d);
      }
      // Scan in batches of 50 for speed
      const BATCH = 50;
      for (let i = 0; i < candidates.length; i += BATCH) {
        const batch = candidates.slice(i, i + BATCH);
        const results = await Promise.allSettled(
          batch.map(async (ip) => {
            const url = "https://" + ip + ":5000";
            if (await probeServer(url)) return url;
            throw new Error("no");
          })
        );
        for (const r of results) {
          if (r.status === "fulfilled") {
            logDebug("SUCCESS via subnet scan: " + r.value);
            return r.value;
          }
        }
      }

      // Strategy 6: Ask the user for manual entry
      logDebug("Auto-discovery failed. Prompting for manual IP.");
      return null;
    }

    function showManualIpEntry() {
      const ip = prompt(
        "Could not find Valen server automatically.\n\n" +
        "Enter your PC's IP address (from Tailscale or Wi-Fi).\n" +
        "Example: 100.90.240.21 or 10.0.0.252"
      );
      if (ip && ip.trim()) {
        const url = "https://" + ip.trim() + ":5000";
        localStorage.setItem(CACHED_IP_KEY, ip.trim());
        return url;
      }
      return null;
    }

    async function initServerConnection() {
      let url = await discoverServer();
      if (!url) {
        url = showManualIpEntry();
      }
      if (url) {
        SERVER_URL = url;
        // Cache the working IP for next time
        try {
          const u = new URL(url);
          localStorage.setItem(CACHED_IP_KEY, u.hostname);
          if (isAndroid) AndroidBridge.setServerUrl(url);
        } catch (_) {}
        statusBadge.innerText = "● CONNECTED";
        logDebug("Server locked: " + SERVER_URL);
        appendChat("Valen: Connected to server. Tap below to start listening.", "valen-text");
        micBtn.disabled = false;
      } else {
        statusBadge.innerText = "● DISCONNECTED";
        logDebug("No server found. Tap the button to retry.");
        appendChat("Valen: Could not find server. Check your PC is running mobile_valen_bridge.py.", "valen-text");
        micBtn.disabled = true;
      }
    }

    // --- Voice Listener (unchanged logic) ---

    async function toggleSmartVADListener() {
      if (!SERVER_URL) {
        logDebug("No server connected. Re-scanning...");
        await initServerConnection();
        return;
      }
      if (!isListenerActive) {
        isListenerActive = true;
        micBtn.innerText = "⏹ STOP LISTENER";
        micBtn.className = "mic-btn active";
        logDebug("User tapped Start Listener.");
        initAudioVAD();
      } else {
        isListenerActive = false;
        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
        if (audioContext) audioContext.close();
        orb.className = "orb";
        statusBadge.innerText = "● READY";
        micBtn.innerText = "▶ START 24/7 VOICE LISTENER";
        micBtn.className = "mic-btn";
        logDebug("Listener Stopped.");
      }
    }

    async function initAudioVAD() {
      logDebug("Requesting Microphone permission...");
      try {
        const micId = document.getElementById("micSelect").value;
        const constraints = { audio: micId ? { deviceId: { exact: micId } } : true, video: false };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        logDebug("Microphone Permission Granted/Active!");

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
        logDebug("AudioContext state: " + audioContext.state);
        
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        analyser.fftSize = 512;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          if (audioChunks.length > 0 && !isProcessing) {
            isProcessing = true;
            logDebug("Speech detected! Creating audio package...");
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            await processFullUserSpeech(audioBlob);
            isProcessing = false;
          }
          if (isListenerActive) {
            audioChunks = [];
            detectVoiceActivity(dataArray);
          }
        };

        orb.className = "orb";
        statusBadge.innerText = "● LISTENING FOR YOUR VOICE...";
        logDebug("VAD Engine running. Listening for voice...");
        detectVoiceActivity(dataArray);

      } catch (err) {
        logDebug("MIC ACCESS ERROR: " + err.name + " - " + err.message);
        alert("Microphone Access Notice: Open this URL in Chrome once to grant permission!");
        isListenerActive = false;
        micBtn.innerText = "▶ START 24/7 VOICE LISTENER";
        micBtn.className = "mic-btn";
      }
    }

    let speechStartTime = 0;

    function detectVoiceActivity(dataArray) {
      if (!isListenerActive || isProcessing) return;

      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      let averageVolume = sum / dataArray.length;
      
      const now = Date.now();
      if (now - lastLogTime > 2000) {
        logDebug("Current mic volume: " + Math.round(averageVolume));
        lastLogTime = now;
      }

      if (averageVolume > 15) { // Lowered threshold from 20 to 15 for better sensitivity
        if (!isSpeaking) {
          isSpeaking = true;
          speechStartTime = Date.now();
          audioChunks = [];
          if (mediaRecorder.state === "inactive") mediaRecorder.start();
          orb.className = "orb listening";
          statusBadge.innerText = "● HEARING YOUR VOICE...";
          logDebug("Voice detected! (Vol: " + Math.round(averageVolume) + ")");
        }
        if (silenceTimer) clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (isSpeaking && mediaRecorder.state === "recording") {
            isSpeaking = false;
            mediaRecorder.stop();
            const duration = Date.now() - speechStartTime;
            if (duration < 800) {
              logDebug("Speech too short (< 800ms), ignoring noise burst.");
              audioChunks = [];
              if (isListenerActive) {
                orb.className = "orb";
                statusBadge.innerText = "● LISTENING FOR YOUR VOICE...";
                // Keep listening without processing
              }
            } else {
              logDebug("Silence detected. Sending to Nova...");
            }
          }
        }, 2500); // Increased from 1800 to 2500 for better pause tolerance
      }

      if (isListenerActive) {
        requestAnimationFrame(() => detectVoiceActivity(dataArray));
      }
    }

    async function processFullUserSpeech(audioBlob) {
      const formData = new FormData();
      formData.append("audio", audioBlob, "full_speech.webm");
      const selectedVoice = document.getElementById("voiceSelect").value;
      formData.append("voice", selectedVoice);

      try {
        statusBadge.innerText = "● NOVA IS THINKING...";
        logDebug("Sending audio to " + SERVER_URL + "/voice_chat...");

        const res = await fetch(SERVER_URL + "/voice_chat", {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        logDebug("PC Server Response: " + JSON.stringify(data));

        if (data.is_wake_word && data.text) {
          appendChat("Pilot: " + data.user_text, "user-text");
          appendChat("BT-7274: " + data.text, "valen-text");
          await playValenVoice();
        } else {
          logDebug("No wake word or silent noise ignored.");
          statusBadge.innerText = "● LISTENING FOR YOUR VOICE...";
          orb.className = "orb";
        }
      } catch (err) {
        logDebug("SERVER COMM ERROR: " + err.message);
      }
    }

    function playValenVoice() {
      return new Promise((resolve) => {
        logDebug("Playing BT voice response...");
        const audio = new Audio(SERVER_URL + "/audio?t=" + new Date().getTime());
        orb.className = "orb speaking";
        statusBadge.innerText = "● BT IS SPEAKING...";

        audio.play();
        audio.onended = () => {
          orb.className = "orb";
          statusBadge.innerText = "● LISTENING FOR YOUR VOICE...";
          logDebug("Playback complete. Resuming listener.");
          resolve();
        };
        audio.onerror = (e) => {
          logDebug("Audio playback error: " + (e.message || "unknown"));
          orb.className = "orb";
          statusBadge.innerText = "● LISTENING FOR YOUR VOICE...";
          resolve();
        };
      });
    }

    function appendChat(text, className) {
      const div = document.createElement("div");
      div.className = className;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function requestInitialPermissions() {
      try {
        logDebug("Requesting microphone permission on startup...");
        globalAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        logDebug("Microphone permission granted on startup.");
        await initDeviceList();
      } catch (err) {
        logDebug("Microphone permission denied or ignored on startup: " + err.message);
      }
    }

    async function initDeviceList() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(d => d.kind === 'audioinput');
        const select = document.getElementById('micSelect');
        select.innerHTML = '<option value="">Default Microphone</option>';
        
        audioInputs.forEach(device => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Microphone ${select.length}`;
          select.appendChild(option);
        });
      } catch (err) {
        logDebug("Could not load mic list: " + err.message);
      }
    }

    function saveVoicePreference() {
      const voice = document.getElementById("voiceSelect").value;
      localStorage.setItem("valen_voice_pref", voice);
      logDebug("Voice changed to: " + voice);
    }

    function loadVoicePreference() {
      const savedVoice = localStorage.getItem("valen_voice_pref");
      if (savedVoice) {
        document.getElementById("voiceSelect").value = savedVoice;
      }
    }

    // --- Boot: auto-discover server on page load ---
    window.addEventListener("DOMContentLoaded", async () => {
      logDebug("APK Web View loaded.");
      loadVoicePreference();
      await requestInitialPermissions();
      logDebug("Starting auto-discovery...");
      initServerConnection();
    });
  </script>
</body>
</html>
